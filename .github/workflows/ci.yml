name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # JOB 1: CHECK BUILD
  build-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Build Check
        run: npm run build

  # JOB 2: BUILD & PUSH DOCKER IMAGE
  docker-push:
    needs: build-check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          # Matches your secret: DOCKER_USERNAME
          username: ${{ secrets.DOCKER_USERNAME }}
          # Matches your secret: DOCKER_PASSWORD
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: manoj124/kongu-guvi-hub:v1

  # JOB 3: DEPLOY TO EC2 (SAFE MODE)
  deploy:
    needs: docker-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          # UPDATED: Matches your secret 'EC2_SSH'
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Stopping testing container..."
            # Using 'myapp-test' on Port 8081 to avoid breaking Jenkins
            sudo docker stop myapp-test || true
            sudo docker rm myapp-test || true
            
            echo "Pulling latest image..."
            sudo docker pull manoj124/kongu-guvi-hub:v1
            
            echo "Starting new container..."
            sudo docker run -d \
              -p 8081:80 \
              --restart always \
              --name myapp-test \
              manoj124/kongu-guvi-hub:v1
