name: CI/CD Pipeline

# Trigger on push to main or Pull Requests
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # JOB 1: CI - TEST & BUILD CHECK
  # This runs on every push and PR to ensure code is healthy
  build-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Build Check
        run: npm run build

  # JOB 2: CD - BUILD & PUSH DOCKER IMAGE
  # Runs ONLY if 'build-check' passes and it is a push to 'main'
  docker-push:
    needs: build-check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: manoj124/kongu-guvi-hub:v1

  # JOB 3: CD - DEPLOY TO EC2
  # Runs ONLY if 'docker-push' finishes successfully
  deploy:
    needs: docker-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Stop and remove the old container (ignore errors if it doesn't exist)
            docker stop my-app || true
            docker rm my-app || true
            
            # 2. Pull the latest image from Docker Hub
            docker pull manoj124/kongu-guvi-hub:v1
            
            # 3. Run the new container on Port 80
            docker run -d -p 80:80 --name my-app manoj124/kongu-guvi-hub:v1
