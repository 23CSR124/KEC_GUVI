name: Build Check

# Trigger this workflow on push to main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Node.js (Version 20 is standard for Vite)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Install dependencies (Clean install)
      - name: Install Dependencies
        run: npm ci

      # 4. Run the Build command (This catches the "White Screen" errors)
      - name: Build Project
        run: npm run build